name: "Terraform Infrastructure Deployment"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    
    # ดึง Secret มาเป็น Environment Variable
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "ap-northeast-3"
      # แก้ไขจุดที่ 2: ใช้ ['...'] แทนจุด เพื่อรองรับชื่อที่ขึ้นต้นด้วยตัวเลข
      TF_VAR_db_password: ${{ secrets['s_tier_secret'] }}

    steps:
      # 1. Checkout โค้ดจาก Repository
      - name: Checkout
        uses: actions/checkout@v3

      # 2. ติดตั้ง Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      # 3. เริ่มต้น (Init)
      - name: Terraform Init
        run: terraform init

      # 4. ตรวจสอบ Syntax (Validate)
      - name: Terraform Validate
        run: terraform validate

      # 5. ตรวจสอบรูปแบบโค้ด (Format Check)
      - name: Terraform Format
        run: terraform fmt -check

      # 6. Security Scan
      - name: Security Scan
        run: |
          docker run --rm -v $(pwd):/src aquasec/tfsec /src

      # 7. วางแผน (Plan)
      - name: Terraform Plan
        run: terraform plan -input=false

      # 8. สร้างจริง (Apply)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

